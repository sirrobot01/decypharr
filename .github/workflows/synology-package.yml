name: Synology DSM 7.x and SRM 1.x packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'synology/**'
      - '.github/workflows/synology-package.yml'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
  push:
    branches:
      - main
      - beta
      - 'synology-*'
    tags:
      - 'v*'
    paths:
      - 'synology/**'
      - '.github/workflows/synology-package.yml'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: write

concurrency:
  group: synology-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  SPKSRC_REF: e353e52f6117f59326550ece07ca0c68903a57fc
  DECYPHARR_BASE_VERSION: "0.0.0-dev"

jobs:
  smoke:
    name: Smoke / DSM 7.3 apollolake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Decypharr
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Derive package version
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${DECYPHARR_BASE_VERSION}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Prepare pinned spksrc tree
        env:
          DECYPHARR_GIT_HASH: ${{ steps.meta.outputs.source_sha }}
          SPKSRC_DIR: ${{ github.workspace }}/.synology-build/spksrc
        run: bash synology/prepare-spksrc.sh

      - name: Cache apollolake toolchain and Go modules
        uses: actions/cache@v6
        with:
          path: |
            .synology-build/spksrc/toolchain/*/work
            .synology-build/spksrc/distrib/go
          key: synology-apollolake-7.3-${{ hashFiles('go.sum', 'synology/cross/decypharr/Makefile', 'synology/spk/decypharr/Makefile') }}
          restore-keys: |
            synology-apollolake-7.3-

      - name: Build apollolake SPK
        env:
          DECYPHARR_GIT_HASH: ${{ steps.meta.outputs.source_sha }}
          DECYPHARR_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker run --rm             -e DECYPHARR_GIT_HASH             -e DECYPHARR_VERSION             -v "${PWD}/.synology-build/spksrc:/spksrc"             -w /spksrc             ghcr.io/synocommunity/spksrc:latest             make -C spk/decypharr arch-apollolake-7.3 SPK_PACKAGE_ARCHS=apollolake

      - name: Collect apollolake package
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p out
          mapfile -t packages < <(find .synology-build/spksrc/packages -maxdepth 1 -type f -name 'decypharr*.spk' -print | sort)
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one Decypharr SPK, found ${#packages[@]}"
            printf '%s\n' "${packages[@]}"
            exit 1
          fi
          OUTPUT="out/decypharr-${VERSION}-dsm7.3-apollolake.spk"
          cp "${packages[0]}" "${OUTPUT}"
          sha256sum "${OUTPUT}" > "${OUTPUT}.sha256"

      - name: Upload apollolake SPK
        uses: actions/upload-artifact@v7
        with:
          name: synology-DSM-7.3-apollolake
          path: out/*
          if-no-files-found: error
          retention-days: 30

  build:
    name: ${{ matrix.platform }} ${{ matrix.version }} / ${{ matrix.arch }}
    needs: smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - { platform: DSM, version: '7.3', arch: avoton, build_target: avoton-7.3 }
          - { platform: DSM, version: '7.3', arch: braswell, build_target: braswell-7.3 }
          - { platform: DSM, version: '7.3', arch: broadwell, build_target: broadwell-7.3 }
          - { platform: DSM, version: '7.3', arch: broadwellnk, build_target: broadwellnk-7.3 }
          - { platform: DSM, version: '7.3', arch: broadwellnkv2, build_target: broadwellnkv2-7.3 }
          - { platform: DSM, version: '7.3', arch: broadwellntbap, build_target: broadwellntbap-7.3 }
          - { platform: DSM, version: '7.3', arch: bromolow, build_target: bromolow-7.3 }
          - { platform: DSM, version: '7.3', arch: denverton, build_target: denverton-7.3 }
          - { platform: DSM, version: '7.3', arch: epyc7002, build_target: epyc7002-7.3 }
          - { platform: DSM, version: '7.3', arch: epyc7003, build_target: epyc7003-7.3 }
          - { platform: DSM, version: '7.3', arch: epyc7003ntb, build_target: x64-7.3 }
          - { platform: DSM, version: '7.3', arch: geminilake, build_target: geminilake-7.3 }
          - { platform: DSM, version: '7.3', arch: geminilakenk, build_target: geminilakenk-7.3 }
          - { platform: DSM, version: '7.3', arch: grantley, build_target: grantley-7.3 }
          - { platform: DSM, version: '7.3', arch: icelaked, build_target: x64-7.3 }
          - { platform: DSM, version: '7.3', arch: kvmx64, build_target: kvmx64-7.3 }
          - { platform: DSM, version: '7.3', arch: purley, build_target: purley-7.3 }
          - { platform: DSM, version: '7.3', arch: r1000, build_target: r1000-7.3 }
          - { platform: DSM, version: '7.3', arch: r1000nk, build_target: r1000nk-7.3 }
          - { platform: DSM, version: '7.3', arch: v1000, build_target: v1000-7.3 }
          - { platform: DSM, version: '7.3', arch: v1000nk, build_target: v1000nk-7.3 }
          - { platform: DSM, version: '7.3', arch: alpine, build_target: alpine-7.3 }
          - { platform: DSM, version: '7.3', arch: alpine4k, build_target: alpine4k-7.3 }
          - { platform: DSM, version: '7.3', arch: armada38x, build_target: armada38x-7.3 }
          - { platform: DSM, version: '7.3', arch: monaco, build_target: monaco-7.3 }
          - { platform: DSM, version: '7.3', arch: armada37xx, build_target: armada37xx-7.3 }
          - { platform: DSM, version: '7.3', arch: rtd1619b, build_target: rtd1619b-7.3 }
          - { platform: SRM, version: '1.3', arch: dakota, build_target: dakota-1.3 }
          - { platform: SRM, version: '1.3', arch: ipq806x, build_target: ipq806x-1.3 }
          - { platform: SRM, version: '1.3', arch: cypress, build_target: cypress-1.3 }

    steps:
      - name: Checkout Decypharr
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Derive package version
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${DECYPHARR_BASE_VERSION}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Prepare pinned spksrc tree
        env:
          DECYPHARR_GIT_HASH: ${{ steps.meta.outputs.source_sha }}
          SPKSRC_DIR: ${{ github.workspace }}/.synology-build/spksrc
        run: bash synology/prepare-spksrc.sh

      - name: Cache spksrc toolchain and Go modules
        uses: actions/cache@v6
        with:
          path: |
            .synology-build/spksrc/toolchain/*/work
            .synology-build/spksrc/distrib/go
          key: synology-${{ matrix.build_target }}-${{ hashFiles('go.sum', 'synology/cross/decypharr/Makefile', 'synology/spk/decypharr/Makefile') }}
          restore-keys: |
            synology-${{ matrix.build_target }}-

      - name: Build SPK
        env:
          DECYPHARR_GIT_HASH: ${{ steps.meta.outputs.source_sha }}
          DECYPHARR_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker run --rm             -e DECYPHARR_GIT_HASH             -e DECYPHARR_VERSION             -v "${PWD}/.synology-build/spksrc:/spksrc"             -w /spksrc             ghcr.io/synocommunity/spksrc:latest             make -C spk/decypharr "arch-${{ matrix.build_target }}" "SPK_PACKAGE_ARCHS=${{ matrix.arch }}"

      - name: Collect package
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p out
          mapfile -t packages < <(find .synology-build/spksrc/packages -maxdepth 1 -type f -name 'decypharr*.spk' -print | sort)
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one Decypharr SPK, found ${#packages[@]}"
            printf '%s\n' "${packages[@]}"
            exit 1
          fi
          PLATFORM="$(printf '%s' "${{ matrix.platform }}" | tr '[:upper:]' '[:lower:]')"
          OUTPUT="out/decypharr-${VERSION}-${PLATFORM}${{ matrix.version }}-${{ matrix.arch }}.spk"
          cp "${packages[0]}" "${OUTPUT}"
          sha256sum "${OUTPUT}" > "${OUTPUT}.sha256"

      - name: Upload SPK
        uses: actions/upload-artifact@v7
        with:
          name: synology-${{ matrix.platform }}-${{ matrix.version }}-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach Synology packages to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [smoke, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all Synology artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: synology-*
          path: release
          merge-multiple: true

      - name: Build checksum manifest
        shell: bash
        run: |
          cd release
          find . -maxdepth 1 -type f -name '*.spk' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          for attempt in {1..40}; do
            if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              break
            fi
            sleep 15
          done

          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG}"               --repo "${GITHUB_REPOSITORY}"               --title "decypharr ${TAG}"               --generate-notes
          fi

          gh release upload "${TAG}" release/*.spk release/SHA256SUMS             --repo "${GITHUB_REPOSITORY}"             --clobber
